name: docs hygiene
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly nudge, Monday 06:00 UTC
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # WQ-C4 reads `git log --format=%s`. At the default fetch-depth of 1
          # that log is one commit long, so no orphan can ever be found and the
          # check is inert in CI while passing locally. 0 fetches full history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Five separate steps, not one script: a failure names which instrument
      # broke. The three test suites ran only when someone remembered to run
      # them, which is this project's own definition of a rule rather than an
      # instrument - see 40-devops/drift-audit-spec.md, "Why this exists".
      - name: docs hygiene check
        run: python3 scripts/docs-check.py
      - name: work-queue check
        run: python3 scripts/queue-check.py
      - name: queue-check test suite
        run: bash scripts/tests/test-queue-check.sh
      - name: session-brief test suite
        run: bash scripts/tests/test-session-brief.sh
      - name: drift-fixture test suite
        run: bash scripts/tests/test-drift-fixture.sh
